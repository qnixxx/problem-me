name: Read-only Problem.me preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'next/**'
      - 'test-readonly-preview.cjs'
      - '.github/workflows/readonly-preview.yml'
  push:
    branches: [main]
    paths:
      - 'next/**'
      - 'test-readonly-preview.cjs'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node test-readonly-preview.cjs
