name: Security and regression checks
on:
  push:
    branches: [security/**]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Security checks
        run: node test-security.cjs
      - name: Model and schema tests
        run: node test-pilot.cjs
      - name: Readability checks
        run: node test-readability.cjs
      - name: Runtime packaging check
        run: python3 build-release.py --check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node test-browser.cjs
      - run: node test-nav.cjs
      - run: node test-typography.cjs
