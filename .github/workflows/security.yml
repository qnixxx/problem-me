name: Read-only production regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build-release.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-content-polish.cjs
  browser:
    # Playwright 1.56 does not support the current ubuntu-latest image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --only-shell chromium
      - run: node test-production-readonly.cjs
